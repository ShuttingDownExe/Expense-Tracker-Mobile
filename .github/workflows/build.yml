name: Build APK

# Branch → environment mapping:
#   push to UAT  → test build, distributed to the uat-testers group
#   push to main → prod build (artifact only; not auto-distributed to UAT)
# workflow_dispatch lets you build either env manually and choose distribution.
#
# `test`/`prod` map to the hosted App Hosting backends + HTTPS; email sign-in is
# on for test and off for prod (see lib/config/app_config.dart).
#
# Only GitHub's own first-party actions (actions/*) are used. Flutter is
# installed from Google's official release tarball and distribution uses
# Google's official Firebase CLI — no third-party actions.
on:
  push:
    branches: [UAT, main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [test, prod]
        default: test
      distribute:
        description: Upload to Firebase App Distribution
        type: boolean
        default: true

# Cancel an in-progress build if the same branch is pushed again.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.38.7'
  FIREBASE_APP_ID: '1:202069546642:android:a31694bec7b0ca8bfc784b'
  # Semantic base for the version name; the workflow run number is appended as
  # the patch and used as the (always-incrementing) build/version code.
  # Bump this when you cut a real minor/major release.
  VERSION_BASE: '1.01'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Decide the target env + whether to distribute, from the branch (for
      # pushes) or the manual inputs (for workflow_dispatch).
      - name: Resolve build environment
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET_ENV="${{ inputs.environment }}"
            DISTRIBUTE="${{ inputs.distribute }}"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            TARGET_ENV="prod"
            DISTRIBUTE="false"
          else
            TARGET_ENV="test"
            DISTRIBUTE="true"
          fi
          echo "TARGET_ENV=$TARGET_ENV" >> "$GITHUB_ENV"
          echo "DISTRIBUTE=$DISTRIBUTE" >> "$GITHUB_ENV"
          echo "Resolved env=$TARGET_ENV distribute=$DISTRIBUTE (event=${{ github.event_name }}, ref=${{ github.ref_name }})"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Cache the Flutter SDK (and its precached engine artifacts) by version.
      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: ~/flutter
          key: flutter-${{ env.FLUTTER_VERSION }}-linux

      # Install Flutter from Google's official release storage (no 3rd-party
      # action). Skipped when restored from cache.
      - name: Install Flutter
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/flutter/bin/flutter" ]; then
            curl -fsSL -o "$RUNNER_TEMP/flutter.tar.xz" \
              "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
            tar -xf "$RUNNER_TEMP/flutter.tar.xz" -C "$HOME"
          fi
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          git config --global --add safe.directory "$HOME/flutter"

      # The Firebase config files are git-ignored, so recreate them from
      # repository secrets (base64-encoded). Same files for test and prod.
      #   base64 -i android/app/google-services.json   # → GOOGLE_SERVICES_JSON
      #   base64 -i lib/firebase_options.dart          # → FIREBASE_OPTIONS_DART
      - name: Restore Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_SERVICES_JSON:-}" ]; then
            echo "::error::Secret GOOGLE_SERVICES_JSON is empty/unset (must be a Repository secret, base64 of the file)."; exit 1
          fi
          if [ -z "${FIREBASE_OPTIONS_DART:-}" ]; then
            echo "::error::Secret FIREBASE_OPTIONS_DART is empty/unset (must be a Repository secret, base64 of the file)."; exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
          echo "$FIREBASE_OPTIONS_DART" | base64 --decode > lib/firebase_options.dart
          # Sanity-check the decoded files are what we expect.
          grep -q '"project_id"' android/app/google-services.json \
            || { echo "::error::google-services.json decoded wrong — is GOOGLE_SERVICES_JSON base64 of the file?"; exit 1; }
          grep -q 'class DefaultFirebaseOptions' lib/firebase_options.dart \
            || { echo "::error::firebase_options.dart decoded wrong — is FIREBASE_OPTIONS_DART base64 of the file?"; exit 1; }
          echo "Firebase config restored OK."

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-

      # Write the release keystore + key.properties so the APK is signed with a
      # stable key whose SHA-1 is registered in Firebase (required for Google
      # sign-in on distributed builds). ANDROID_KEYSTORE is base64 of the .jks.
      - name: Set up release signing
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE:-}" ]; then
            echo "::error::Secret ANDROID_KEYSTORE is empty/unset (base64 of the release .jks)."; exit 1
          fi
          echo "$ANDROID_KEYSTORE" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # versionName = VERSION_BASE.<run_number> (e.g. 1.0.42), versionCode =
      # <run_number>, so every build has a distinct, increasing version.
      - name: Build APK (${{ env.TARGET_ENV }})
        run: |
          flutter build apk --release \
            --dart-define=APP_ENV="$TARGET_ENV" \
            --build-name="${VERSION_BASE}.${{ github.run_number }}" \
            --build-number="${{ github.run_number }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ env.TARGET_ENV }}-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # Distribute via Google's official Firebase CLI (firebase-tools), authed
      # with a service account that has the "Firebase App Distribution Admin"
      # role. Requires the `uat-testers` group in Firebase App Distribution.
      # FIREBASE_SERVICE_ACCOUNT is base64 of the service-account JSON.
      - name: Distribute to uat-testers
        if: ${{ env.DISTRIBUTE == 'true' }}
        env:
          SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          echo "$SERVICE_ACCOUNT_B64" | base64 --decode > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npm install -g firebase-tools
          firebase appdistribution:distribute \
            build/app/outputs/flutter-apk/app-release.apk \
            --app "$FIREBASE_APP_ID" \
            --groups uat-testers \
            --release-notes "v${VERSION_BASE}.${{ github.run_number }} · $TARGET_ENV · ${{ github.sha }}"

# NOTE: release builds are currently signed with the debug key (Flutter's
# default release signingConfig). For Play Store distribution, add a real
# keystore via secrets and wire a signingConfig in android/app/build.gradle.kts.
